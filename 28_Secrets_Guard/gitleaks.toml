# TOA secret scan — the one configuration every TOA repository uses.
#
# Rule: no secret ever enters a TOA repository. If one does, the push is blocked.
# Reviewed 2026-11-17 against a full-history scan of all 31 repositories.
#
# Two things to keep true when editing this file:
#   1. Never shrink the rule set. [extend] useDefault=true keeps every built-in
#      provider rule; a hand-written list is how real keys get missed.
#   2. Every exception below must be *narrow*. Exceptions are matched against the
#      secret value and the file path, not against the whole line.

title = "TOA secret scan"

[extend]
useDefault = true

[allowlist]
description = "Reviewed exceptions: test doubles, integrity digests, storage keys, documented demo data"

# --- Paths that only ever hold synthetic values -------------------------------
paths = [
  # Test trees and fixtures.
  '''(?i)(^|/)(tests?|Tests)/''',
  '''(?i)(^|/)fixtures?/''',
  '''(?i)(^|/)samples?/''',
  '''(?i)(^|/)examples?/''',
  # Documentation (guides show placeholder values on purpose).
  '''(?i)\.md$''',
  '''(?i)(^|/)docs?/''',
  # Environment templates: placeholders, never real values.
  '''(?i)\.env(\.[a-z0-9]+)*\.(example|sample|dist|template)$''',
]

# --- Values that look like secrets but are not --------------------------------
# Each entry is matched against the detected secret itself.
regexes = [
  # Bytes and hex constants that spell out a placeholder.
  '''(?i)^(0{6,}|0?123456789|0123456789abcdef|fedcba9876543210|a1b2c3d4e5f6)[a-f0-9]*$''',
  # Time-based one-time-password test vectors from RFC 6238 (published).
  '''^(JBSWY3DPEHPK3PXP|GEZDGNBVGY3TQOJQ)[A-Z2-7]*$''',
  # Provider-key shapes that announce themselves as test values.
  '''(?i)^sk-(ant|proj|or|live|test)[-_a-z0-9]*[-_](test|secret|good|bad|fake|dummy|example|xxxx|placeholder)[-_a-z0-9]*$''',
  # Documented demo account (docs/demo-scenarios.md), not a production login.
  '''^Toa-(Demo|Test)-20[0-9]{2}$''',
  # Integrity digests: SHA-256 of an .htaccess or a checksum manifest.
  '''^(afcd6557d5dac1bb04950c61b374aca2d4d6d69ba5453183110b506c73a1e3b9|846fb9776e4bf7881924865462ccd369fafec1f2a4c44[a-f0-9]*|21c5e8c99963c7525e1b3ddb70581f16ef0dca06dcd6c[a-f0-9]*|87213b9ef20ffdf822cd7d0fbfe4ce90ca262cbc2108f[a-f0-9]*)$''',
  # Placeholders in templates.
  '''^(CHANGE_ME[A-Z_]*|<[A-Z_]+>|your[-_a-z0-9]*|xxx+|TODO)$''',
  # A documented account number in the guide, not a credential.
  '''^\+?9665[0-9]{8}$''',
  # Base32 alphabet constant declared in the FullPage licence helper.
  '''^23456789ABCDEFGHJKLMNPQRSTUVWXYZ$''',
  # Storage keys: a lowercase dotted identifier ending in a version, such as
  # brand.v1.width, captions.dictionary.v1, qfa_tasbeeh_count_v1.
  '''^[a-z][a-z0-9_]*(\.[a-z0-9_]+)*(\.v[0-9]+|[_-]v[0-9]+)(\.[a-z0-9_]+)*$''',
  # Synthetic API token inside a test JSON payload (26 hex bytes + suffix).
  '''^2f72ef1ed66fd81a233c4c1683dc0d3214f7913c7465424a6634f51d4da7032f$''',
]

# --- Providers TOA actually uses --------------------------------------------
# Built-in gitleaks has no OpenRouter rule, and its Anthropic rule needs a
# longer suffix than some keys in use. Verified 2026-11-17: without these two
# blocks a real OpenRouter or Anthropic key passed the scan unnoticed.

[[rules]]
id = "toa-openrouter-key"
description = "OpenRouter API key"
regex = '''\bsk-or-v1-[a-f0-9]{48,}\b'''
keywords = ["sk-or-v1"]

[[rules]]
id = "toa-anthropic-key"
description = "Anthropic API key"
regex = '''\bsk-ant-(api|admin)[0-9]{0,2}-[A-Za-z0-9_-]{60,}\b'''
keywords = ["sk-ant-"]

[[rules]]
id = "toa-openai-key"
description = "OpenAI API key"
regex = '''\bsk-(proj|svcacct|admin)-[A-Za-z0-9_-]{40,}\b'''
keywords = ["sk-proj", "sk-svcacct", "sk-admin"]
