name: Secret scan

# Rule: no secret enters a TOA repository. This runs on every push and every
# pull request, scans the full history (not just the diff), and fails the check
# when a key, password, token or private key is found.
#
# The rules live in 28_Secrets_Guard/gitleaks.toml in this repository, which is
# the brand/standards repository. Each project carries a byte-identical copy,
# so a fork or a detached clone is still protected.

on:
  push:
  pull_request:
  schedule:
    # Weekly, Monday 06:00 Riyadh (03:00 UTC): catches a key that slipped in
    # through a branch or an old commit after the fact.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan full history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/28_Secrets_Guard/gitleaks.toml
          GITLEAKS_CONFIG_TOML: ""
